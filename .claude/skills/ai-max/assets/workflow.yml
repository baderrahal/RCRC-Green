# Runs the tests on every pull request.
# Copy to .github/workflows/tests.yml and change the run command to match this repo.

name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Change this line to whatever runs the tests here.
      - name: Run tests
        run: python -m pytest -v

      # A gate that runs zero tests reports green forever, so fail loudly if none were found.
      - name: Fail if no tests ran
        if: always()
        run: |
          if [ ! -d tests ] && [ ! -f test_*.py ]; then
            echo "No tests found. This gate is not protecting anything."
            exit 1
          fi
