# Builds the whole solution and runs the Core tests, on every pull request into main and on
# every push to main. The add-in project compiles with no Revit installed, because the two
# Nice3point packages supply the reference assemblies, so a compile break in RcrcGreen.Revit
# is this gate's to catch. Only the Core tests run, because the add-in can only be executed
# inside Revit.

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hooks are the only thing standing between two sessions that cannot see each
      # other, and they had no test until one of them was walked past in silence. Run by
      # hand they are run by nobody, so they run here, first, because they take a second
      # and a broken guard is worth knowing about before a build starts.
      #
      # A run that checks nothing reports green forever, so the count is read back the same
      # way the dotnet one is.
      - name: Check the hooks
        run: |
          bash .claude/hooks/hook-tests.sh | tee hook-results.txt
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "The hook checks failed."
            exit 1
          fi
          RAN=$(grep -oE '^[0-9]+ passed' hook-results.txt | grep -oE '[0-9]+')
          if [ -z "$RAN" ] || [ "$RAN" -eq 0 ]; then
            echo "Zero hook cases ran. This step is not protecting anything."
            exit 1
          fi
          echo "$RAN hook cases ran."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RcrcGreen.sln

      - name: Build the whole solution
        run: dotnet build RcrcGreen.sln --no-restore

      - name: Run tests
        run: >
          dotnet test tests/RcrcGreen.Core.Tests/RcrcGreen.Core.Tests.csproj
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      # A gate that runs zero tests reports green forever, so read the count back out of the
      # result file and fail when it is zero or the file never appeared.
      - name: Fail if no tests ran
        run: |
          RESULTS=$(find TestResults -name '*.trx' | head -1)
          if [ -z "$RESULTS" ]; then
            echo "No test result file was written. This gate is not protecting anything."
            exit 1
          fi
          TOTAL=$(grep -o '<Counters[^>]*total="[0-9]*"' "$RESULTS" | head -1 | grep -o '[0-9][0-9]*')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "Zero tests ran. This gate is not protecting anything."
            exit 1
          fi
          echo "$TOTAL tests ran."
